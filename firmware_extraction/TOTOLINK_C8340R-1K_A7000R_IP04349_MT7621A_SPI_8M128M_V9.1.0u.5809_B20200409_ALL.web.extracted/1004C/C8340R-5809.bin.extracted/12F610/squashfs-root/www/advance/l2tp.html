g5")):2==e?t("MRU"+s.lang_t("vpn.msg7")):t()}}}},created:function(){var s=this;uiPost.getL2tpServerCfg(function(n){s.status=1==n.enable,s.InitialStatusVal=1==n.enable;var t=n.server.lastIndexOf(".")+1,e=n.sip.lastIndexOf(".")+1,i=n.server.lastIndexOf(".")+1;s.sip=n.sip.slice(t,n.sip.length),s.eip=n.eip.slice(e,n.eip.length),s.server=n.server.slice(i,n.server.length),s.ipPrefix=n.server.slice(0,i),s.sipPrefix=n.sip.slice(0,t),s.eipPrefix=n.eip.slice(0,e),s.priDns=n.priDns,s.secDns=n.secDns,s.mtu=n.mtu,s.mru=n.mru})},methods:{l2tp_enable:function(n){var t=this;if(0==t.status&&t.status!=t.InitialStatusVal){var e={enable:"0"};uiPost.setL2tpServerCfg(e,function(n){var t=1;n&&(n.wtime&&"0"!=n.wtime&&(t=n.wtime),Cstool.applyLoad(t,function(){location.href=location.href}))})}},handleSubmit:function(){var t=this,e={};Cstool.Verify(this.formRules,function(n){n&&t.status&&(e.enable=t.status?"1":"0",e.sip=t.sipPrefix+t.sip,e.eip=t.eipPrefix+t.eip,e.server=t.ipPrefix+t.server,e.priDns=t.priDns,e.secDns=t.secDns,e.mtu=t.mtu,e.mru=t.mru,uiPost.setL2tpServerCfg(e,function(n){var t=1;n&&(n.wtime&&"0"!=n.wtime&&(t=n.wtime),Cstool.applyLoad(t,function(){location.href=location.href}))}))})}}}</script><script src="/static/js/main.js"></script></body></html>
