<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="proma" content="no-cache"><meta http-equiv="cache-control" content="no cache"><meta http-equiv="expires" content="0"><title></title><meta content="width=device-width,initial-scale=1,user-scalable=no" name="viewport"><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="/static/css/phone/main.css"><link rel="stylesheet" href="/static/css/phone/common.css"><style>body{font-size:9px;color:#fff}.position{float:left}.speed_down{width:40%;margin-left:20%}.speed_down span{color:#fff;font-size:16px}.speed_up{width:40%}.speed_up span{color:#00688b;font-size:16px}.info{top:10%;left:6%;float:left}.info span{color:#fff;font-size:16px}.col-info{white-space:nowrap;overflow-x:auto;padding:0}.ssid-size{font-size:10px}</style></head><body><div id="app"></div><script type="text/x-template" id="main"><div>
  <phone-back url="/phone/home.html"></phone-back>
  <div align="center">
    <img src="/static/images/phone/router2.png">
    <p>{{ model }}</p>
  </div>
  <br>
  <div style="width:100%;">
    <div class="position speed_down">
      <img src="/static/images/phone/speed_down.png" align="absmiddle" />
      <span>{{ downOccupy }}</span>
    </div>
    <div class="position speed_up">
      <img src="/static/images/phone/speed_up.png" align="absmiddle" />
      <span>{{ upOccupy }}</span>
    </div>
  </div>
  
  <div style="width:100%;">
    <div>
    <canvas id="myChart" style="height: 200px;width: 100%;"></canvas>
    </div>
  </div>
  
  <div style="width:100%;">
    <!-- Internet -->
    <div>
      <div class="info-title" v-show="!wanShow">
        <img src="/static/images/phone/info-internet.png" align="absmiddle" />
        <span>{{ lang_t('index.internet') }} </span>
      </div>
      <div class="info-content" v-show="!wanShow">
        <div class="info-left">
          {{ lang_t('index.connection_status') }}:
        </div>
        <div class="info-right" v-show="Configured&&!wanStrategyinfo">
          {{ wanWay }} - {{ wanStatus }}
        </div>
        <div class="info-right" v-show="Configured&&wanStrategyinfo">
          {{ wanStatus }}
        </div>
        <div class="info-right" v-show="Configured == false">
          {{ wanStatus }}
        </div>
      </div>
      <div class="info-content" v-if="wanStrategyinfo">
        <div class="info-left">
          {{ lang_t('index.online_way') }}:
          </div>
          <div class="info-right">
            {{ wanStrategyinfo }}
          </div>
      </div>
      <div class="info-content" v-show="!wanShow">
        <div class="info-left">
          {{ lang_t('index.link_time') }}:
          </div>
          <div class="info-right">
            {{ wanConnTime }}
          </div>
      </div>
      <div class="info-content" v-show="!wanShow">
        <div class="info-left">
            {{ lang_t('index.ip') }}:
          </div>
          <div class="info-right">
            {{ wanIp }}
          </div>
      </div>
      <div class="info-content" v-show="!wanShow">
        <div class="info-left">
            {{ lang_t('index.gateway') }}:
          </div>
          <div class="info-right">
            {{ wanGw }}
          </div>
      </div>
      <div class="info-content" v-show="!wanShow">
        <div class="info-left">
          {{ lang_t('index.mac') }}:
        </div>
        <div class="info-right">
          {{ wanMac }}
        </div>
      </div>
    </div>
    <!-- 2.4GHz Wireless -->

      <div class="info-title">
        <img src="/static/images/phone/info-wifi.png" align="absmiddle" />
        <span>{{ lang_t('index.wireless') }} 2.4GHz</span>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.radio') }}:
          </div>
          <div class="info-right">
            {{ wifiOff == '0'? lang_t('common.on') : lang_t('common.off') }}
          </div>
      </div>

        <div class="info-left">
            {{ lang_t('index.ssid') }}:

      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.mac') }}:
          </div>
          <div class="info-right">
            {{ bssid }}
          </div>
      </div>
    </div>

        <span v-if="wifiDualband == '2'">{{ lang_t('index.wireless') }} 5GHz (1)</span>
      </div>
      <div class="info-content">
        <div class="info-left">
              {{ lang_t('index.radio') }}:
          </div>
          <div class="info-right">
              {{ wifiOff5g == '0'? lang_t('common.on') : lang_t('common.off') }}

        <div class="info-left">
            {{ lang_t('index.ssid') }}:
          </div>

        <div class="info-left">
            {{ lang_t('index.ssid') }}:
          </div>

      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.mac') }}:
          </div>
          <div class="info-right">
            {{ bssid5g2 }}
          </div>
      </div>
    </div>
    <!-- rpt --> 
    <div style="margin-top:2%" v-if="isRptMode">
      <div class="info-title">
        <img src="/static/images/phone/info-wifi.png" align="absmiddle" />
        <span>{{ lang_t('index.rpt_info') }}</span>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.conn_status') }}:
          </div>
          <div class="info-right">
            {{ rptConnStatus == 'success'? lang_t('index.rpt_conn') : lang_t('index.rpt_disconn')}}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.rptmsg') }}SSID:
          </div>
          <div class="info-right">
            {{ apcliSsid }}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.rptmsg') }}MAC:
          </div>
          <div class="info-right">
            {{ apcliBssid }}
          </div>
      </div>
    </div>

      <div class="info-title">
        <img src="/static/images/phone/info-set.png" align="absmiddle" />
        <span>{{ lang_t('index.system') }}</span>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.model') }}:
          </div>
          <div class="info-right">
            {{ model }}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">   
            {{ lang_t('index.version') }}:
          </div>
          <div class="info-right">
            {{ fmVersion }}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.up_time') }}:
          </div>
          <div class="info-right">
            {{ upTime }}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('index.build_time') }}:
          </div>
          <div class="info-right">
            {{ buildTime }}
          </div>
  	  </div>
      <div class="info-content" v-if="globalConfig.modelType == '4g'">
        <div class="info-left">
            {{ lang_t('index.4gstatus') }}:
          </div>
          <div class="info-right">
            {{ registStatusMsg }}
          </div>
      </div>
      <div class="info-content">
        <div class="info-left">
            {{ lang_t('menu.opmode') }}:
          </div>
          <div class="info-right">
            {{ currentMode }}
          </div>
      </div>
    </div>
  </div>
